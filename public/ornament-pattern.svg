<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <!-- Master Buta centered around 0,0 -->
    <g id="buta">
      <path d="M 0,20 C -15,20 -20,5 -20,-5 C -20,-15 -10,-20 0,-20 C 10,-20 15,-15 15,-7 C 15,0 7,3 5,-3 C 3,-8 7,-13 13,-10" fill="none" stroke="black" stroke-width="1.5"/>
      <circle cx="-5" cy="0" r="2" fill="black" />
      <path d="M -12,8 C -5,13 5,13 10,5" fill="none" stroke="black" stroke-width="1"/>
    </g>
  </defs>
  
  <g>
    <!-- Top-left Buta -->
    <use href="#buta" x="25" y="25" />
    
    <!-- Bottom-right Buta (upside down) -->
    <use href="#buta" x="75" y="75" transform="rotate(180 75 75)" />
    
    <!-- Top-right Buta (rotated 90) -->
    <use href="#buta" x="75" y="25" transform="rotate(90 75 25)" />
    
    <!-- Bottom-left Buta (rotated 270) -->
    <use href="#buta" x="25" y="75" transform="rotate(270 25 75)" />
    
    <!-- Center diamond -->
    <polygon points="50,40 60,50 50,60 40,50" fill="none" stroke="black" stroke-width="1.5"/>
    <circle cx="50" cy="50" r="2" fill="black" />
    
    <!-- Corner diamonds (to tile perfectly) -->
    <polygon points="0,-10 10,0 0,10 -10,0" fill="none" stroke="black" stroke-width="1.5"/>
    <polygon points="100,-10 110,0 100,10 90,0" fill="none" stroke="black" stroke-width="1.5"/>
    <polygon points="0,90 10,100 0,110 -10,100" fill="none" stroke="black" stroke-width="1.5"/>
    <polygon points="100,90 110,100 100,110 90,100" fill="none" stroke="black" stroke-width="1.5"/>
    
    <!-- Edge dots -->
    <circle cx="50" cy="0" r="2" fill="black" />
    <circle cx="50" cy="100" r="2" fill="black" />
    <circle cx="0" cy="50" r="2" fill="black" />
    <circle cx="100" cy="50" r="2" fill="black" />
  </g>
</svg>
